<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 1 · Plantilla Bootstrap</title>

  <!-- ============================================================
       EJERCICIO 1 · Plantilla inicial
       ============================================================
       PASO 2a: añade aquí la etiqueta <meta name="viewport" ...>
       PASO 2b: añade aquí el <link> al CSS de Bootstrap (CDN)
  -->
  <!-- SOLUCIÓN PASO 2a -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SOLUCIÓN PASO 2b -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>

  <!-- PASO 2c: escribe aquí un contenedor con un título, un párrafo y un botón -->
  <div class="container py-4">
    <h1 class="display-4 text-primary">¡Hola, Bootstrap 5!</h1>
    <p class="lead">Esta es la plantilla base funcionando con componentes y estilos de Bootstrap cargados por CDN.</p>
    <button type="button" class="btn btn-primary">Botón de prueba</button>
  </div>

  <!-- PASO 2d: añade aquí el <script> del JS de Bootstrap (bundle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- PASO 4: comenta el <link> del CSS (Ctrl + /), guarda y observa qué cambia -->
  <!-- PASO 5: DevTools (F12) → Network → recarga y busca los archivos de Bootstrap -->

  <p class="container"><a href="../index.html">← Volver al índice</a></p>
</body>
</html>
